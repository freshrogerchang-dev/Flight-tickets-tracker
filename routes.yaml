# 機票追蹤設定檔 —— 這是唯一需要你編輯的檔案。
#
# 目前追：台北 → 雪梨(SYD) / 黃金海岸(OOL)
#
# ⚠️ 日期是先填的預設值（2026 年 12 月），請改成你真正要飛的區間。
#    改完先跑 `flight-tracker run --dry-run` 確認查詢數沒爆掉。

currency: TWD

# 單次執行的查詢數上限。目的地數 × 日期天數很容易爆量，
# 展開後超過這個數字會直接中止並告訴你實際數量，而不是硬跑到被 Google 擋。
max_queries: 60

# 用近幾天的價格中位數當 alert_drop_pct 的基準線。
baseline_days: 30

defaults:
  adults: 1
  seat: economy
  # 台北飛黃金海岸沒有直飛，一定要轉機；雪梨雖有直飛，但放寬到 2 段
  # 才能抓到轉機的便宜票（例如經香港、馬尼拉、新加坡）。
  max_stops: 2

routes:
  # ── 主力：雪梨 vs 黃金海岸，哪邊便宜就飛哪邊 ──────────────────
  - name: 台北-澳洲東岸
    from: TPE
    to: [SYD, OOL]
    trip: round
    compare: true            # 報表會把兩個目的地排名
    windows:
      - depart_range: [2026-12-12, 2026-12-26]   # ← 改成你的出發區間
        nights: 12                                # ← 改成你要待幾晚
    # 這個門檻是先抓的起始值，不是精算過的市場價。
    # 跑一兩週累積歷史後，alert_drop_pct 會自己抓到真正的行情。
    alert_below: 26000
    alert_drop_pct: 12

  # ── 進出不同城市：雪梨進、黃金海岸出（沿東岸玩下來很常見）──────
  # 用不到就整段刪掉。
  - name: 雪梨進黃金海岸出
    trip: multi
    legs:
      - { from: TPE, to: SYD, depart: 2026-12-12 }
      - { from: OOL, to: TPE, depart: 2026-12-24 }
    alert_below: 30000

# ── 其他寫法備忘 ──────────────────────────────────────────────
#
# 多個出發地（高雄也想比）：
#   from: [TPE, KHH]
#
# 排除特定組合：
#   exclude:
#     - [KHH, OOL]
#
# 單程：
#   trip: oneway
#   windows:
#     - depart: 2026-12-12      # 單程不需要 nights
#
# 布里斯本(BNE)離黃金海岸開車約一小時，票價常常更便宜，想一起比就加進去：
#   to: [SYD, OOL, BNE]
