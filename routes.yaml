# 機票追蹤設定檔 —— 這是唯一需要你編輯的檔案。
#
# 目前追：台北 → 雪梨(SYD) / 黃金海岸(OOL)，2027-06-05 出發、2027-06-16 回程（11 晚）。
#
# 改日期或路線之後，先跑 `flight-tracker run --dry-run` 確認查詢數沒爆掉。

currency: TWD

# 依序嘗試，第一個查到票價的就採用。
# fast-flights（Google Flights）對 OOL 這類航線會整批失敗，Kiwi 查得到，
# 所以擺在後面當備援——雪梨這種正常的航線根本不會呼叫到它。
providers: [fast_flights, kiwi]

# 單次執行的查詢數上限。目的地數 × 日期天數很容易爆量，
# 展開後超過這個數字會直接中止並告訴你實際數量，而不是硬跑到被 Google 擋。
max_queries: 60

# 用近幾天的價格中位數當 alert_drop_pct 的基準線。
baseline_days: 30

defaults:
  adults: 1
  seat: economy
  max_stops: 1

# 雪梨和黃金海岸拆成兩條路線，因為兩地需要的轉機上限不同，
# 但共用同一個 group，`report --group 台北-澳洲東岸` 仍會把它們一起排名。
routes:
  # ── 雪梨：2 段就查得到（2026-12 實測票價帶約 22k–42k，僅供參考，6 月淡季價格會不同）──
  - name: 台北-雪梨
    group: 台北-澳洲東岸
    from: TPE
    to: SYD
    trip: round
    windows:
      - nights: 11                                # ← 改成你要待幾晚
        depart: 2027-06-05
    alert_below: 30000
    alert_drop_pct: 12

  # ── 黃金海岸：2 段時 fast-flights 全部查詢失敗，放寬到 3 段再試 ──
  # 沒有直飛，通常要經馬尼拉 / 新加坡 / 布里斯本，路徑比雪梨長。
  # 若 3 段仍然全掛，改追布里斯本 BNE（開車約一小時到黃金海岸）。
  - name: 台北-黃金海岸
    group: 台北-澳洲東岸
    from: TPE
    to: OOL
    trip: round
    max_stops: 3
    windows:
      - nights: 11
        depart: 2027-06-05
    alert_below: 30000
    alert_drop_pct: 12

  # ── 進出不同城市：雪梨進、黃金海岸出（沿東岸玩下來很常見）──────
  # 用不到就整段刪掉。含 OOL，所以一併放寬到 3 段。
  - name: 雪梨進黃金海岸出
    trip: multi
    max_stops: 2
    legs:
      - {from: TPE, to: SYD, depart: 2027-06-05}
      - {from: OOL, to: TPE, depart: 2027-06-16}
    alert_below: 50000

# ── 其他寫法備忘 ──────────────────────────────────────────────
#
# 多個出發地（高雄也想比）：
#   from: [TPE, KHH]
#
# 排除特定組合：
#   exclude:
#     - [KHH, OOL]
#
# 單程：
#   trip: oneway
#   windows:
#     - depart: 2026-12-12      # 單程不需要 nights
#
# 布里斯本(BNE)離黃金海岸開車約一小時，票價常常更便宜，想一起比就加進去：
#   to: [SYD, OOL, BNE]
