# 機票追蹤設定檔 —— 這是唯一需要你編輯的檔案。
#
# 目前追：台北 → 雪梨(SYD) / 布里斯本(BNE)，2027-06-19 出發、2027-07-03 回程（14 晚）。
# 兩個目的地放在同一條路線裡比價，只要直飛（max_stops: 0），不轉機。
#
# 改日期或路線之後，先跑 `flight-tracker run --dry-run` 確認查詢數沒爆掉。
# 也可以從指令頻道（Telegram 或 ntfy）下 /scan /to /stops 等指令改，見 README〈從手機改航線〉。

currency: TWD

# 依序嘗試，第一個查到票價的就採用。fast-flights（Google Flights）在少數航線
# 上會整批失敗，Kiwi 查得到，所以擺在後面當備援。
providers: [fast_flights, kiwi]

# 單次執行的查詢數上限。目的地數 × 日期天數很容易爆量，
# 展開後超過這個數字會直接中止並告訴你實際數量，而不是硬跑到被 Google 擋。
max_queries: 60

# 用近幾天的價格中位數當 alert_drop_pct 的基準線。
baseline_days: 30

defaults:
  adults: 1
  seat: economy
  max_stops: 0

routes:
  # 雪梨、布里斯本放在同一條路線、同一個 group，compare: true 讓
  # `/report` 或 `report --group 台北-澳洲東岸` 把兩個目的地排名比較。
  - name: 台北-澳洲東岸
    from: TPE
    to: [SYD, BNE]
    trip: round
    compare: true
    windows:
      - depart: 2027-06-19
        nights: 14
    alert_below: 30000
    alert_drop_pct: 12

# ── 其他寫法備忘 ──────────────────────────────────────────────
#
# 多個出發地（高雄也想比）：
#   from: [TPE, KHH]
#
# 排除特定組合：
#   exclude:
#     - [KHH, BNE]
#
# 單程：
#   trip: oneway
#   windows:
#     - depart: 2026-12-12      # 單程不需要 nights
#
# 進出不同城市（開口式行程），一張票：
#   trip: multi
#   legs:
#     - {from: TPE, to: SYD, depart: 2027-06-19}
#     - {from: BNE, to: TPE, depart: 2027-07-03}
#
# 也可以直接從指令頻道（Telegram 或 ntfy）操作，不用手動改這個檔案：
#   /to SYD BNE OOL        整個換掉目的地
#   /stops 2               放寬轉機上限
#   /scan 2027-07-01 14    改掃描日期
#   /pause                 暫停這條路線（設定保留，不再查價通知）
#   /chart                 畫近 90 天價格趨勢圖
#   /rename 新名稱          幫路線改名
# 完整指令列表見 README，或直接對指令頻道發 /help。
