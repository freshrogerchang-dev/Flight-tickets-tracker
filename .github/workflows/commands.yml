name: Apply commands

on:
  # 已經改成完全靠 cloudflare/telegram-webhook/ 那個 Worker 觸發（webhook 模式）。
  # 拿掉排程輪詢是必要的，不是選配：Telegram 一旦幫這個 bot 設定了 webhook，
  # 就會拒絕所有 getUpdates 呼叫（回 409），排程輪詢在這個模式下只會每次失敗。
  #
  # 想切回排程輪詢的話：跑 `curl .../deleteWebhook` 解除 webhook，再把下面這行
  # cron 加回來：
  #   schedule:
  #     - cron: '13,43 * * * *'
  workflow_dispatch:
    inputs:
      message:
        description: 'Telegram 訊息全文（由 webhook relay 帶入；留空則照常輪詢）'
        required: false
        default: ''
      message_id:
        description: 'Telegram update_id（webhook relay 帶入，僅供記錄）'
        required: false
        default: ''

permissions:
  contents: write

# 不要有兩個 job 同時改 routes.yaml
concurrency:
  group: flight-tracker-commands
  cancel-in-progress: false

jobs:
  commands:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Read and apply commands
        id: apply
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMAND_SECRET: ${{ secrets.COMMAND_SECRET }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_COMMAND_TOPIC: ${{ secrets.NTFY_COMMAND_TOPIC }}
          NTFY_COMMAND_SECRET: ${{ secrets.NTFY_COMMAND_SECRET }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          # Passed via env, never interpolated straight into the shell script:
          # this text comes from whoever messaged the bot, and ${{ }} spliced
          # directly into `run:` would let it inject arbitrary shell commands.
          WEBHOOK_MESSAGE: ${{ github.event.inputs.message }}
          WEBHOOK_MESSAGE_ID: ${{ github.event.inputs.message_id }}
        run: |
          if [ -n "$WEBHOOK_MESSAGE" ]; then
            python -m tracker.cli commands --message "$WEBHOOK_MESSAGE" --message-id "$WEBHOOK_MESSAGE_ID"
          else
            python -m tracker.cli commands
          fi

      - name: Commit config changes
        run: |
          if [ -z "$(git status --porcelain routes.yaml data/)" ]; then
            echo "沒有變更"
            exit 0
          fi
          git config user.name  "flight-tracker[bot]"
          git config user.email "flight-tracker[bot]@users.noreply.github.com"
          git add routes.yaml data/
          git commit -m "chore: 套用來自指令頻道的變更"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "推送失敗，第 ${attempt} 次重試..."
            sleep $((attempt * 5))
          done
          echo "::error::設定變更推送失敗"
          exit 1

      # /run 要求立刻查一輪，不等每天的排程
      - name: Track now if asked
        if: steps.apply.outputs.run_now == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python -m tracker.cli run | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit prices from the immediate run
        if: steps.apply.outputs.run_now == 'true'
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then exit 0; fi
          git config user.name  "flight-tracker[bot]"
          git config user.email "flight-tracker[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore: 更新價格紀錄（手動觸發）"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
