[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flight-tickets-tracker"
version = "0.1.0"
description = "Track flight prices between configurable origins and destinations, alert on cheap fares."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.31",
    # v3 introduced create_query/FlightQuery, which is the API used here.
    "fast-flights>=3.0",
    # fast-flights 3.1.0 imports typing_extensions but does not declare it,
    # so a clean install crashes on import without this line.
    "typing_extensions>=4.0",
    # Round-trip YAML editing: routes.yaml is hand-written and commented, and
    # commands must not reformat it. PyYAML cannot preserve comments.
    "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
# Kept out of the base dependencies: `commands` is triggered by every phone
# command (including latency-sensitive ones via the Telegram webhook relay),
# and pulling in matplotlib's own dependency chain on every single command
# would slow all of them down for a package only /chart ever imports. The
# commands.yml workflow installs this extra only when a message actually
# contains "/chart" -- see its "Install CJK font for chart labels" step.
chart = [
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8.0",
    "matplotlib>=3.8",
]

[project.scripts]
flight-tracker = "tracker.cli:main"

[tool.setuptools.packages.find]
include = ["tracker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
